[package]
name = "smartvpn-engine"
version = "0.3.0-dev.1"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
marmo-proto = "0.0.4"
marmo-net = "0.0.4"
yamux = "0.13"
tokio-util = { version = "0.7", features = ["codec", "io", "compat"] }
wind-tuic = { git = "https://github.com/rust-proxy/wind", rev = "3ab2388761a32337e9f810348869ce68bfcc3067", default-features = false, features = ["client", "quinn", "ring"] }
wind-core = { git = "https://github.com/rust-proxy/wind", rev = "3ab2388761a32337e9f810348869ce68bfcc3067" }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde_json = "1"
socket2 = "0.6"
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
aes-gcm = "0.10"
base64 = "0.22"
bytes = "1"
blake2 = "0.10"
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
chacha20poly1305 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
h2 = "0.4"
hkdf = "0.12"
http = "1"
httparse = "1"
md-5 = "0.10"
rand = "0.8"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
tokio-tungstenite = "0.26"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"
x25519-dalek = { version = "2", features = ["static_secrets"] }

serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.13"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"

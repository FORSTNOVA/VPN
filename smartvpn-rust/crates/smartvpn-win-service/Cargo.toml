[package]
name = "smartvpn-win-service"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
smartvpn-runtime.workspace = true
clash-lib = { path = "../../vendor/clash-rs/clash-lib", default-features = false, features = ["ring"] }
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Security", "Win32_System_Rpc"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "smartvpn-rust-service"
path = "src/main.rs"

[workspace]
resolver = "2"
exclude = ["vendor/clash-rs"]
members = ["crates/smartvpn-runtime", "crates/smartvpn-android-jni", "crates/smartvpn-win-service"]

[workspace.package]
version = "0.4.0-alpha.19"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde_json = "1"
smartvpn-runtime = { path = "crates/smartvpn-runtime" }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
rustls = { git = "https://github.com/Watfaq/rustls.git", branch = "watfaq/0.23.45" }
tokio-rustls = { git = "https://github.com/Watfaq/tokio-rustls.git", branch = "watfaq/0.26.4" }
